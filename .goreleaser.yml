version: 2

env:
  - GO111MODULE=on
  - GOPROXY=https://proxy.golang.org
before:
  hooks:
    - go mod download
builds:
  -
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - 386
      - amd64
      - arm
      - arm64
    ignore:
      -
        goos: darwin
        goarch: 386
    flags:
      - "-a"
    ldflags:
      - '-extldflags "-static"'
checksum:
  name_template: '{{.ProjectName}}_checksums.txt'
changelog:
  sort: asc
  filters:
    exclude:
    - '^docs:'
    - '^test:'
    - Merge pull request
    - Merge branch
archives:
  -
    # keeps the v1 `replacements` naming: Darwin/Linux/Windows, i386, x86_64
    name_template: >-
      {{ .ProjectName }}_{{ title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
    -
      goos: windows
      formats: [zip]
    wrap_in_directory: true
nfpms:
  -
    file_name_template: '{{ .ProjectName }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}'
    homepage:  https://github.com/moul/grpcbin
    description: "grpcbin"
    maintainer: "Manfred Touron <https://manfred.life>"
    license: "Apache-2.0 OR MIT"
    vendor: moul
    formats:
      - deb
      - rpm
