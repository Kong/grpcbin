version: "2"

run:
  timeout: 1m
  tests: false

linters:
  default: none
  enable:
    - bodyclose
    - dogsled
    - dupl
    - errcheck
    #- funlen
    - gochecknoinits
    #- gocognit
    - goconst
    - gocritic
    - gocyclo
    - govet
    - ineffassign
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    goconst:
      min-len: 5
      min-occurrences: 4
    misspell:
      locale: US
    revive:
      # replaces golint, which had no unused-parameter check
      confidence: 0
      enable-default-rules: true
      rules:
        - name: unused-parameter
          disabled: true
    staticcheck:
      checks:
        - all
        # stylecheck was disabled in v1; it is now part of staticcheck
        - -ST*
        - -QF*
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - testing.go
      - .*\.pb\.go
      - .*\.gen\.go

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - testing.go
      - .*\.pb\.go
      - .*\.gen\.go
